[project]
name = "multipublisher"
version = "0.1.0"
description = "Multi-platform content publishing tool for creators"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "mistune>=3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "premailer>=3.10",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
